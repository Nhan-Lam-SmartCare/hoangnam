<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <!-- Cache control - không cache HTML để luôn tải assets mới nhất -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#1e293b" />
    <title>Sơn Nam - Quản lý bán hàng</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="description"
      content="Sơn Nam - Phần mềm quản lý bán hàng"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200"
  >
    <div id="root"></div>
    <script>
      (function () {
        var RECOVERY_KEY = "motocare-react-activity-recovery-v1";

        function hasActivityInitError(message) {
          var msg = String(message || "").toLowerCase();
          return (
            msg.indexOf("cannot set properties of undefined") !== -1 &&
            msg.indexOf("activity") !== -1
          );
        }

        async function recoverFromStaleBundle() {
          try {
            if (sessionStorage.getItem(RECOVERY_KEY) === "1") {
              return;
            }
            sessionStorage.setItem(RECOVERY_KEY, "1");

            if ("serviceWorker" in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function (reg) {
                return reg.unregister();
              }));
            }

            if ("caches" in window) {
              var names = await caches.keys();
              await Promise.all(names.map(function (name) {
                return caches.delete(name);
              }));
            }
          } catch (err) {
            console.warn("[Recovery] Bundle recovery failed:", err);
          }

          var url = new URL(window.location.href);
          url.searchParams.set("bundle_recover", String(Date.now()));
          window.location.replace(url.toString());
        }

        window.addEventListener("error", function (event) {
          if (hasActivityInitError(event && event.message)) {
            recoverFromStaleBundle();
          }
        });

        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var message =
            typeof reason === "string"
              ? reason
              : reason && reason.message
              ? reason.message
              : "";

          if (hasActivityInitError(message)) {
            recoverFromStaleBundle();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
